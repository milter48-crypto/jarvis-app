<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Джарвис Панель</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 22px;
        }
        .btn {
            width: 100%;
            max-width: 300px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px 0;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1 id="user-greeting">Панель управления</h1>
    
    <button class="btn" onclick="sendCommand('protocol_relax')">🎵 Протокол Музыка</button>
    <button class="btn" onclick="sendCommand('protocol_solve')">🧠 Друг реши</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Твой токен бота
        const BOT_TOKEN = "8956031398:AAEXs1_4KLhOdYoOcTQqr7UCf_a2U8DGPQ8";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}! 👋`;
        }

        async function sendCommand(cmd) {
            // Получаем ID пользователя Telegram
            const userId = tg.initDataUnsafe?.user?.id;
            
            if (userId) {
                try {
                    // Отправляем команду прямо в чат с ботом через Telegram API
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: userId,
                            text: cmd
                        })
                    });
                } catch (e) {
                    console.error("Ошибка отправки:", e);
                }
            } else {
                alert("Не удалось определить ID пользователя Telegram.");
            }

            // Закрываем окно приложения
            try {
                tg.close();
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>
</html>
